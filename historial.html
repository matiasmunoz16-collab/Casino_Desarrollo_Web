<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Historial - Casino Delfines</title>
    <link rel="stylesheet" href="ccs_front/Historial.css">
</head>
<body>

    <header>
        <h1 id="Delfin">
            <img src="imagenes/delfincasino.jpg" alt="Logo Casino Delfines" id="logo">
            <span class="Titulo">    
                <span id="Palabra1">Casino</span>
                <br>
                <span id="Palabra2">Delfines</span>
            </span>
        </h1>

        <div id="Barra_Juegos">
            <nav class="Menu">
                <a href="index.html#juegos" class="barra">Juegos</a>
                <a href="historial.html" class="barra">Mi historial</a>
                <a href="Ranking.html" class="barra">Ranking</a>
            </nav>
        </div>

        <div>
            <a href="Login.html">
                <button type="Login">Iniciar sesion</button>
                <button type="Login">Registrar cuenta</button>
            </a>
        </div>
    </header>

    <main>

        <section class="Resumen">
            <div class="Bien">
                <h2>Historial de <span id="usuario-nombre">Jugador</span></h2>
            </div>

            <div class="Total_Credito">
                <h3>Total Apostado</h3>
                <span class="money"> $: <span id="total-apostado">0</span></span>
            </div>

            <div class="Mayor_Ganancia">
                <h3>Balance Neto</h3>
                <span class="money"> $: <span id="balance-neto">0</span></span>
            </div>
        </section>

        <section class="SeccionTabla">
            <table class="TablaHistorial">
                <thead>
                    <tr>
                        <th>Fecha</th>
                        <th>Juego</th>
                        <th>Tipo</th>
                        <th>Monto</th>
                        <th>Resultado</th>
                    </tr>
                </thead>
                <tbody id="historial-body">
                    <!-- JavaScript inyectará las filas aquí -->
                </tbody>
            </table>
        </section>

    </main>

    <footer>
        <p>2026 Casino Los Mirandas. Todos los derechos reservados. Solo para fines académicos y entretenimiento con créditos virtuales.</p>
    </footer>

    <script src=""></script>
</body>
</html>
