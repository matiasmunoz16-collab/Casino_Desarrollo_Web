<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Historial - Casino Delfines</title>
    <link rel="stylesheet" href="ccs_front/Historial.css">
    <link rel="manifest" href="manifest.json">
</head>
<body x-data="usuarioController">

    <header>
        <h1 id="Delfin">
            <img src="imagenes/delfincasino.jpg" alt="Logo Casino Delfines" id="logo">
            <span class="Titulo">    
                <span id="Palabra1">Casino</span>
                <br>
                <span id="Palabra2">Delfines</span>
            </span>
        </h1>

        <div id="Barra_Juegos">
            <nav class="Menu">
                <a href="index.html#juegos" class="barra">Juegos</a>
                <a href="historial.html" class="barra">Mi historial</a>
                <a href="Ranking.html" class="barra">Ranking</a>
            </nav>
        </div>

        <div>
            <div x-show="!sesionActiva" style="display: flex; gap: 10px;">
                <a href="Login.html">
                    <button type="button" style="background-color: transparent; border: 1px solid #00bfff; color: white; padding: 8px 15px; border-radius: 5px; font-weight: bold; cursor: pointer;">Iniciar sesion</button>
                </a>
                <a href="Login.html">
                    <button type="button" style="background-color: transparent; border: 1px solid #00bfff; color: white; padding: 8px 15px; border-radius: 5px; font-weight: bold; cursor: pointer;">Registrar cuenta</button>
                </a>
            </div>
            
            <div x-show="sesionActiva">
                <button type="button" @click="salir()" title="Haz clic para cerrar sesión" style="display: flex; align-items: center; gap: 12px; background-color: #071e3d; border: 2px solid #00d2ff; color: #ffffff; padding: 10px 18px; border-radius: 25px; font-weight: bold; font-size: 16px; cursor: pointer; transition: all 0.3s ease;">
                    <span style="font-size: 18px;">👤</span>
                    <span x-text="sesionActiva?.nombre"></span>
                    <span style="color: #00e676; border-left: 1px solid #1d5087; padding-left: 12px; display: flex; align-items: center; gap: 5px;">
                        $<span x-text="sesionActiva?.creditos"></span>
                    </span>
                    <span style="color: #ff4444; font-size: 12px; margin-left: 5px;">(Salir)</span>
                </button>
            </div>
        </div>
    </header>

    <main>
        <section class="Resumen">
            <div class="Bien">
                <h2>Historial de <span id="usuario-nombre" x-text="sesionActiva ? sesionActiva.nombre : 'Jugador'"></span></h2>
            </div>

            <div class="Total_Credito">
                <h3>Total Apostado</h3>
                <span class="money"> $: <span id="total-apostado">0</span></span>
            </div>

            <div class="Mayor_Ganancia">
                <h3>Balance Neto</h3>
                <span class="money"> $: <span id="balance-neto">0</span></span>
            </div>
        </section>

        <section class="SeccionTabla">
            <table class="TablaHistorial">
                <thead>
                    <tr>
                        <th>Fecha</th>
                        <th>Juego</th>
                        <th>Tipo</th>
                        <th>Monto</th>
                        <th>Resultado</th>
                    </tr>
                </thead>
                <tbody id="historial-body">
                    <!-- JavaScript inyectará las filas aquí -->
                </tbody>
            </table>
        </section>
    </main>

    <footer>
        <p>2026 Casino Los Mirandas. Todos los derechos reservados. Solo para fines académicos y entretenimiento con créditos virtuales.</p>
    </footer>
    
    <script src="js/apuestas.repository.js"></script>
    <script src="js/apuestas.service.js"></script>
    <script src="js/apuestas.controller.js"></script>
    <script src="js/usuario.repository.js"></script>
    <script src="js/usuario.service.js"></script>
    <script src="js/main.js"></script>
    <script src="js/usuario.controller.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.9/dist/cdn.min.js"></script>
</body>
</html>
