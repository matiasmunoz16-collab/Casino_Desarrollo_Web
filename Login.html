<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./ccs_front/login.css">
    <title>Casino Delfines</title>
</head>
<body>
    <form id="cuenta" x-data="usuarioController" @submit.prevent="registrarse()" > 
        <h1>Crear Cuenta</h1>

        <p class="error" style="color: red; text-align: center; font-weight: bold; margin-bottom:10px;" x-text="errorGeneral"></p>

        <div class="campo">
            <label for="nombre">Nombre de usuario</label>
            <input type="text" id="nombre" name="nombre" x-model="datosRegistro.nombre" minlength="3" maxlength="20" required autocomplete="username">
        </div>

        <div class="campo">
            <label for="email">Correo</label>
            <input type="email" id="email" name="email" x-model="datosRegistro.email" required autocomplete="email">
        </div>

        <div class="campo">
            <label for="contrasena">contrasena</label>
            <input type="password" id="password" name="password" x-model="datosRegistro.password" minlength="5" required autocomplete="new-password">
        </div>

        <div class="campo">
            <label for="confirmar">confirmar contrasena</label>
            <input type="password" id="confirmar" name="confirmar" x-model="datosRegistro.confirmar" required autocomplete="new-password">
        </div>

        <button type="submit" class="btn-ingresar">Crear Cuenta</button>

    </form>
      
    <script type="module" src="js/usuario.controller.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>

</body>
</html>
