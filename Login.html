<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./ccs_front/login.css">
    <title>Casino Delfines</title>
    <style>
        .cambiar-vista { 
            color: #ffcc00; 
            text-align: center; 
            margin-top: 15px; 
            cursor: pointer; 
            font-size: 14px;
        }
        .cambiar-vista:hover { text-decoration: underline; }
    </style>
    <link rel="manifest" href="manifest.json">
</head>
<body>
    <div x-data="usuarioController">
        <div x-data="{ vistaLogin: true }">
            <form id="cuenta" @submit.prevent="vistaLogin ? iniciarSesion() : registrarse()"> 
                
                <h1 x-text="vistaLogin ? 'Iniciar Sesión' : 'Crear Cuenta'"></h1>

                <p class="error" style="color: red; text-align: center; font-weight: bold; margin-bottom:10px;" x-text="errorGeneral"></p>

                <div x-show="vistaLogin">
                    <div class="campo">
                        <label for="identificador">Usuario o Correo</label>
                        <input type="text" id="identificador" name="identificador" x-model="datosLogin.identificador" :required="vistaLogin" autocomplete="username">
                    </div>

                    <div class="campo">
                        <label for="login-password">Contraseña</label>
                        <input type="password" id="login-password" name="password" x-model="datosLogin.password" :required="vistaLogin" autocomplete="current-password"> 
                    </div>
                </div>

                <div x-show="!vistaLogin">
                    <div class="campo">
                        <label for="nombre">Nombre de usuario</label>
                        <input type="text" id="nombre" name="nombre" x-model="datosRegistro.nombre" minlength="3" maxlength="20" :required="!vistaLogin" autocomplete="username">
                    </div>

                    <div class="campo">
                        <label for="email">Correo</label>
                        <input type="email" id="email" name="email" x-model="datosRegistro.email" :required="!vistaLogin" autocomplete="email">
                    </div>

                    <div class="campo">
                        <label for="contrasena">Contraseña</label>
                        <input type="password" id="password" name="password" x-model="datosRegistro.password" minlength="5" :required="!vistaLogin" autocomplete="new-password">
                    </div>

                    <div class="campo">
                        <label for="confirmar">Confirmar contraseña</label>
                        <input type="password" id="confirmar" name="confirmar" x-model="datosRegistro.confirmar" :required="!vistaLogin" autocomplete="new-password">
                    </div>
                </div>

                <button type="submit" class="btn-ingresar" x-text="vistaLogin ? 'Ingresar' : 'Crear Cuenta'"></button>

                <p class="cambiar-vista" x-show="vistaLogin" @click="vistaLogin = false; errorGeneral = ''">¿No tienes cuenta? Regístrate aquí</p>
                <p class="cambiar-vista" x-show="!vistaLogin" @click="vistaLogin = true; errorGeneral = ''">¿Ya tienes cuenta? Inicia sesión</p>

            </form>
        </div>
    </div>
      
    <script src="js/apuestas.repository.js"></script>
    <script src="js/apuestas.service.js"></script>
    <script src="js/apuestas.controller.js"></script>
    <script src="js/usuario.repository.js"></script>
    <script src="js/usuario.service.js"></script>
    <script src="js/main.js"></script>
    <script src="js/usuario.controller.js"></script>
    <script defer src="[https://cdn.jsdelivr.net/npm/alpinejs@3.14.9/dist/cdn.min.js](https://cdn.jsdelivr.net/npm/alpinejs@3.14.9/dist/cdn.min.js)"></script>
</body>
</html>
