<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./ccs_front/login.css">
    <title>Casino Delfines</title>
</head>
<body>
    <form id="cuenta"> 
        <h1>Crear Cuenta</h1>

        <div class="campo">
            <label for="nombre">Nombre de usuario</label>
            <input type="text" id="nombre" name="nombre" minlength="3" maxlength="20" required autocomplete="username">
            <div class="error" id="errorNombre"></div>
        </div>

        <div class="campo">
            <label for="email">Correo</label>
            <input type="email" id="email" name="email" required autocomplete="email">
            <div class="error" id="errorEmail"></div>

        </div>

        <div class="campo">
            <label for="contrasena">contrasena</label>
            <input type="password" id="password" name="password" minlength="5" required autocomplete="new-password">
            <div class="error" id="errorConstrasena"></div>

        </div>

        <div class="campo">
            <label for="confirmar">confirmar contrasena</label>
            <input type="password" id="confirmar" name="confirmar" required autocomplete="new-password">
            <div class="error" id="errorConfirmar"></div>

        </div>

        <button type="submit" class="btn-ingresar">Crear Cuenta</button>

    </form>
      
    <script src="js/interacciones.js" defer></script>
    
</body>
</html>
